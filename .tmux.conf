# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
# vim keys to move panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Persistent popup sessions for REPL-style CLI tools (see bin/tmux-popup).
# Detach (prefix + d) to close the popup without killing the session -- the
# conversation/state underneath keeps running, and the same key reopens it.
# Add another tool by copying this line with a different key/command.
bind -r y run-shell '~/.bin/dotfiles/bin/tmux-popup ai "#{pane_current_path}"'

set-option -g set-titles on

# Set vim bindings
set-window-option -g mode-keys vi

# Colours
set -g status-fg green
set -g status-bg black

# Remove time and just have the host name
set -g status-right '#H'

# Persist sessions on reboot
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Set the current git branch
set -g status-right "#(cd #{pane_current_path}; $(thisbranch))"
set -g status-right-length 200

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
